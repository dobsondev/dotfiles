onboarding = false

[theme]
name = "catppuccin"

[ui]
sidebar_width = 48
sidebar_max_width = 60

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"]
]

[experimental]
pane_history = false
